name: Frontend CI/CD Pipeline

# Disparadores: se ejecuta en push y pull request sobre ramas principales
on:
  push:
    branches:
      - main
      - develop
      - feature
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  validate-and-build:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    # Establece la carpeta frontend como directorio de trabajo predeterminado
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias limpias (npm ci)
        run: npm ci

      - name: Validar calidad de código y sintaxis (ESLint)
        run: npm run lint

      - name: Compilar paquete de producción (Vite Build)
        run: npm run build
